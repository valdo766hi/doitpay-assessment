name: validate

# Validation only: no AWS credentials, no id-token, no deploy. Deployment would
# live in a separate workflow behind a protected environment (see README.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.0
  # Keep in step with kubernetes_version in infra/.
  KUBERNETES_VERSION: 1.36.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

  kubernetes:
    name: Kubernetes manifests (kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform

      # Validate what would actually be applied: the rendered kustomization.
      # kubectl (with built-in kustomize) ships with the ubuntu-24.04 runner image.
      - name: Render and validate
        run: |
          kubectl kustomize k8s > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" rendered.yaml

  iac-security:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exceptions are inline (#checkov:skip / checkov.io/skipN) next to the
      # resource they apply to, each with a reason, so they are reviewed in PRs.
      - name: checkov
        run: >-
          docker run --rm --volume "${PWD}:/repo" --workdir /repo "${CHECKOV_IMAGE}"
          --directory /repo
          --framework terraform kubernetes dockerfile github_actions
          --compact --quiet

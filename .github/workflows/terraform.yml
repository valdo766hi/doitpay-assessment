name: terraform

# Plan on every pull request; on main, apply exactly the saved plan after approval.
# No AWS account is attached to this repository, so the plan runs against moto (a
# local mock of the AWS API) and the apply step stays off. See README.md section 3.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

# Never cancel a run on main: it may be mid-apply.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: 1.17.0

jobs:
  plan:
    name: Terraform plan (mocked AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      moto:
        image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
        ports: ["5000:5000"]
    env:
      # Dummy credentials: every AWS call goes to the moto container.
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      AWS_REGION: ap-southeast-3
      AWS_ENDPOINT_URL: http://localhost:5000
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Stands in for the platform team's VPC, so the subnet preconditions really run.
      - name: Create mock VPC and subnets
        run: |
          vpc=$(aws ec2 create-vpc --cidr-block 10.0.0.0/16 --query Vpc.VpcId --output text)
          a=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.0.1.0/24 --availability-zone ap-southeast-3a --query Subnet.SubnetId --output text)
          b=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.0.2.0/24 --availability-zone ap-southeast-3b --query Subnet.SubnetId --output text)
          echo "VPC_ID=$vpc" >> "$GITHUB_ENV"
          echo "SUBNET_IDS=[\"$a\",\"$b\"]" >> "$GITHUB_ENV"

      # With an AWS account this is the S3 backend (terraform init -backend-config=...).
      - name: Use local state
        run: printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf

      - name: terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: terraform plan
        run: >-
          terraform plan -input=false -out=tfplan
          -var-file=terraform.tfvars.example
          -var "vpc_id=${VPC_ID}"
          -var "private_subnet_ids=${SUBNET_IDS}"

      - name: Plan summary
        run: |
          {
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A plan file can hold sensitive values: with a real account, keep it out of a
      # public repository's artifacts (private repo or encrypted upload).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Terraform apply (saved plan)
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required reviewers on this environment make a person approve before apply.
    environment: infra-production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra

      - name: Use local state
        run: printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf

      - name: terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: Show the plan to apply
        run: terraform show -no-color tfplan

      # Off by design: the brief rules out creating resources. With an AWS account,
      # add OIDC credentials (id-token: write) and the S3 backend, then set the
      # TERRAFORM_APPLY repository variable to true.
      - name: terraform apply
        if: vars.TERRAFORM_APPLY == 'true'
        run: terraform apply -input=false tfplan

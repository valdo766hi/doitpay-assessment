name: terraform

# Plan on every pull request; on main, apply exactly the saved plan after approval.
# Written for a real AWS account and switched off: both jobs run only when the
# AWS_ACCOUNT_READY repository variable is "true". Turn it on in this order:
#   1. required reviewers on the infra-production environment (approval first),
#   2. the OIDC roles, state bucket and inputs as repository variables,
#   3. AWS_ACCOUNT_READY = true.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

# Never cancel a run on main: it may be mid-apply.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: 1.17.0
  AWS_REGION: ap-southeast-3

jobs:
  plan:
    name: Terraform plan
    # Fork pull requests never get AWS credentials: a plan can run code from the PR.
    if: >-
      vars.AWS_ACCOUNT_READY == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, exchanged for short-lived AWS credentials
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read-only role, so a pull request cannot change anything.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Real *.tfvars files are gitignored; the non-secret inputs (VPC, subnets,
      # admin roles) come from a repository variable instead.
      - name: Write terraform.tfvars
        env:
          TFVARS: ${{ vars.TERRAFORM_TFVARS }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: terraform init (S3 state)
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=paytrack/sandbox/eks.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Plan summary
        run: |
          {
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A plan file can hold sensitive values: keep the repository private, or
      # encrypt the file before upload, once it plans against a real account.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Terraform apply (saved plan)
    if: github.event_name == 'push' && vars.AWS_ACCOUNT_READY == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required reviewers on this environment make a person approve before apply.
    environment: infra-production
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for the apply role
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Apply role: its trust policy allows only the infra-production environment.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra

      - name: terraform init (S3 state)
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=paytrack/sandbox/eks.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: Show the plan to apply
        run: terraform show -no-color tfplan

      # Applies exactly the reviewed plan; Terraform rejects it if the state changed since.
      - name: terraform apply (saved plan)
        run: terraform apply -input=false tfplan

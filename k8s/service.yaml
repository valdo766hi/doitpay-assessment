apiVersion: v1
kind: Service
metadata:
  name: paytrack-api
  namespace: paytrack
  labels:
    app.kubernetes.io/name: paytrack-api
    app.kubernetes.io/part-of: paytrack
spec:
  # Cluster-internal only; the internal gateway is the single entry point.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paytrack-api
  ports:
    - name: http
      port: 80
      targetPort: http
